name: Package Desktop App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Package on ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            package_script: node ./scripts/package-mac.mjs
            artifact_name: metis-note-macos-installer
          - os: windows-latest
            label: Windows
            package_script: node ./scripts/package-win.mjs
            artifact_name: metis-note-windows-installer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        env:
          NODE_LLAMA_CPP_POSTINSTALL: skip
          NODE_LLAMA_CPP_SKIP_DOWNLOAD: true
        run: npm ci --registry=https://registry.npmjs.org

      - name: Type check
        run: npm run typecheck

      - name: Build app
        run: npm run build

      - name: Package desktop app
        run: ${{ matrix.package_script }}

      - name: Create macOS archive
        if: runner.os == 'macOS'
        id: archive_macos
        shell: bash
        run: |
          set -euo pipefail
          app_dir="$(find release -maxdepth 1 -type d -name 'MetisNote-darwin-*' | head -n 1)"
          if [[ -z "${app_dir}" ]]; then
            echo "Packaged macOS app was not found in release/." >&2
            exit 1
          fi
          version_suffix="${GITHUB_REF_NAME:-${GITHUB_SHA::7}}"
          zip_path="release/MetisNote-macOS-installer-${version_suffix}.zip"
          rm -f "${zip_path}"
          ditto -c -k --sequesterRsrc --keepParent "${app_dir}" "${zip_path}"
          echo "path=${zip_path}" >> "$GITHUB_OUTPUT"

      - name: Create Windows archive
        if: runner.os == 'Windows'
        id: archive_windows
        shell: pwsh
        run: |
          $appDir = Get-ChildItem -Path release -Directory | Where-Object { $_.Name -like 'MetisNote-win32-*' } | Select-Object -First 1
          if (-not $appDir) {
            throw "Packaged Windows app was not found in release/."
          }
          $versionSuffix = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA.Substring(0, 7) }
          $zipPath = Join-Path $PWD "release/MetisNote-Windows-installer-$versionSuffix.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path $appDir.FullName -DestinationPath $zipPath -Force
          "path=$zipPath" >> $env:GITHUB_OUTPUT

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ steps.archive_macos.outputs.path }}
          if-no-files-found: error

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ steps.archive_windows.outputs.path }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: metis-note-*
          merge-multiple: true
          path: release-assets

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
