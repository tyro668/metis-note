<html lang="">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MetisNote</title>
  </head>
  <body>
    <script>
      // Prevent ProseMirror/React DOM reconciliation conflicts.
      // ProseMirror manages its own DOM tree and may remove/move nodes that
      // React still expects to be children of their original parent.
      ;(function () {
        var origRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function (child) {
          if (child.parentNode !== this) {
            return child;
          }
          return origRemoveChild.call(this, child);
        };
        var origInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function (newNode, refNode) {
          if (refNode && refNode.parentNode !== this) {
            return newNode;
          }
          return origInsertBefore.call(this, newNode, refNode);
        };
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
